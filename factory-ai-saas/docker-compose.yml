version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: factory-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: factory123456
      MYSQL_DATABASE: factory_ai_platform
      MYSQL_USER: factory
      MYSQL_PASSWORD: factory123456
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
      - ./deploy/docker/mysql/init:/docker-entrypoint-initdb.d
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-time-zone=+08:00
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ufactory", "-pfactory123456"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - factory-network

  redis:
    image: redis:7-alpine
    container_name: factory-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --requirepass factory123456 --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "factory123456", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - factory-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: factory-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: factory
      RABBITMQ_DEFAULT_PASS: factory123456
      RABBITMQ_DEFAULT_VHOST: /factory
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - factory-network

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:

networks:
  factory-network:
    driver: bridge
